version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════
# docker-compose para DESARROLLO LOCAL
#
# Levanta el servicio Python con hot-reload y el modelo desde disco local.
# NO requiere conexión a AWS.
#
# Uso:
#   1. Copia tu modelo:  cp /ruta/a/modelo.h5 ./model/modelo_tizon_tardio.h5
#   2. Copia .env:       cp .env.example .env
#   3. Levanta:          docker-compose up
#   4. Prueba:           curl http://localhost:8000/health
# ═══════════════════════════════════════════════════════════════════════════

services:

  tizon-python:
    # Usar el stage "dev" del Dockerfile (slim + uvicorn + hot-reload)
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev

    container_name: tizon-python-dev

    ports:
      - "8000:8000"     # API disponible en http://localhost:8000
                        # Swagger en  http://localhost:8000/docs

    # Montar el código fuente como volumen para hot-reload
    # Al modificar cualquier archivo .py, uvicorn reinicia automáticamente
    volumes:
      - ./app:/app/app           # Código de la app
      - ./model:/app/model       # Modelo .h5 (coloca tu modelo aquí)
      - ./tests:/app/tests       # Tests

    # Variables de entorno para desarrollo local
    environment:
      APP_ENV: local
      LOCAL_MODEL_PATH: model/modelo_tizon_tardio.h5
      HOST: "0.0.0.0"
      PORT: "8000"
      RELOAD: "true"
      LOG_LEVEL: info

    # Cargar variables adicionales desde .env (si existe)
    env_file:
      - path: .env
        required: false   # No falla si .env no existe

    # Health check: verifica que el servicio responda
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s   # Tiempo para que el modelo cargue

    # Reiniciar automáticamente si el contenedor falla
    restart: unless-stopped