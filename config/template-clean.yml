AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: Tizon Tardio Detection API

Parameters:
  Stage:
    Type: String
    Default: prod

  LambdaMemoryMB:
    Type: Number
    Default: 2048

  LambdaTimeoutSeconds:
    Type: Number
    Default: 60

Globals:
  Function:
    Timeout: !Ref LambdaTimeoutSeconds
    MemorySize: !Ref LambdaMemoryMB
    Architectures:
      - x86_64

Resources:

  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "tizon-tardio-models-${AWS::AccountId}-${Stage}"

  TizonApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage

  TizonDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/tizon-tardio:latest"

      Environment:
        Variables:
          MODEL_S3_BUCKET: !Ref ModelBucket
          MODEL_S3_KEY: "models/modelo_tizon_tardio.h5"

      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ModelBucket

      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref TizonApi
            Path: /health
            Method: GET

Outputs:
  ApiUrl:
    Value: !Sub "https://${TizonApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
